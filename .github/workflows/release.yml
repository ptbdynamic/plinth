name: Release

# `npm run release` pushes the tag `v<version>`; this publishes `@ptbdynamic/plinth` to npm with
# trusted publishing (npm takes this workflow's OIDC token: no npm token, no one-time code) and
# makes the GitHub release from CHANGELOG.md. To repeat a release, run it by hand with the tag:
# `gh workflow run release.yml -f tag=v1.2.0`. What is already done is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v1.2.0
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          cache: release

      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Publish to npm and make the GitHub release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release:publish
